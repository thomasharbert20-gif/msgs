name: Build Msgs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build engine and app
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          bash ci/build.sh 2>&1 | tee build.log

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "build-${{ github.run_number }}" "dist/msgs-${{ github.run_number }}.apk" \
            --title "Build ${{ github.run_number }}" \
            --notes "${NOTES:-Manual build}" \
            --target "${{ github.sha }}"

      - name: Report result to the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p /tmp/cilog && cd /tmp/cilog
          git init -q
          git config user.name "msgs-ci"
          git config user.email "msgs-ci@users.noreply.github.com"
          printf 'run=%s\nsha=%s\nstatus=%s\n' "${{ github.run_number }}" "${{ github.sha }}" "$JOB_STATUS" > status.txt
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then tail -c 400000 "$GITHUB_WORKSPACE/build.log" > build.log; else echo "no log" > build.log; fi
          git add status.txt build.log
          git commit -q -m "CI run ${{ github.run_number }}: $JOB_STATUS (${{ github.sha }})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-logs
